<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiCal — Iniciar sesión</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: white;
            border: 2px solid #d8dde5;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #f57c20;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            color: #1b2435;
            text-align: center;
        }

        p {
            font-size: 14px;
            color: #6a768d;
            text-align: center;
            line-height: 1.5;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #d8dde5;
        }

        .error {
            font-size: 13px;
            font-weight: 600;
            color: #d93025;
            background: #fdecea;
            border-radius: 10px;
            padding: 10px 14px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">WiCal</div>

        <div>
            <h2>Bienvenido</h2>
        </div>

        <p>Iniciá sesión con tu cuenta de Google para acceder a tu calendario.</p>

        <div class="divider"></div>

        <div
            id="g_id_onload"
            data-client_id="{{ TU_GOOGLE_CLIENT_ID }}"
            data-callback="handleCredentialResponse"
        ></div>

        <div class="g_id_signin" data-type="standard"></div>

    </div>

    <script>
        const state = "{{ state }}";

        async function handleCredentialResponse(response) {
            const token = response.credential;

            const res = await fetch("/callback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, state: state }),
            });

            const data = await res.json();

            if (data.success) {
                if (data.needs_username) {
                    window.location.href = `/registro?state=${state}`;
                } else {
                    window.location.href = `/calendar?state=${state}`;
                }
            } else {
                alert("Error autenticando con Google. Intentá de nuevo.");
            }
        }
    </script>
</body>
</html>
