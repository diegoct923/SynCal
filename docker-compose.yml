services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRESDB_NAME:-syncal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      SOCKETIO_MESSAGE_QUEUE: amqp://guest:guest@rabbitmq:5672//
      POSTGRES_HOST: postgres
      POSTGRESDB_NAME: ${POSTGRESDB_NAME:-syncal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-syncal-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  whatsapp:
    build:
      context: .
      dockerfile: whatsapp/Dockerfile
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      POSTGRES_HOST: postgres
      POSTGRESDB_NAME: ${POSTGRESDB_NAME:-syncal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
      USERS_FILE: /app/data/users.json
    volumes:
      - whatsapp_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: celery_worker/Dockerfile
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      SOCKETIO_MESSAGE_QUEUE: amqp://guest:guest@rabbitmq:5672//
      POSTGRES_HOST: postgres
      POSTGRESDB_NAME: ${POSTGRESDB_NAME:-syncal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRESDB_NAME: ${POSTGRESDB_NAME:-syncal}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - whatsapp

volumes:
  postgres_data:
  whatsapp_data:
